name: Web explorer / quality
on:
  push:
    branches: [main]
    paths: ['web/**', '.github/workflows/web-explorer.yml']
  pull_request:
    branches: [main]
    paths: ['web/**', '.github/workflows/web-explorer.yml']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install
        run: npm ci --no-fund
      - name: Security audit
        run: npm audit --audit-level=high
      - name: Validate real Gold data and KPI formulas
        run: npm test
      - name: Build Vercel application
        run: npm run build
